[project]
name = "eldercare-vision"
version = "0.1.0"
description = "ElderCare Vision: YOLO pose-based fall-detection research POC."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "opencv-python-headless>=4",
    "numpy>=1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "ultralytics>=8.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "onnxruntime>=1.16",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Hash-pinned by freeze manifests (models/, experiments/): editing them breaks
# integrity checks, so they are frozen as-is and skipped by lint/format.
extend-exclude = [
    "experiments/v3/candidates/benchmark_temporal_classifiers_dev.py",
    "experiments/v3/candidates/freeze_v3_candidate.py",
    "experiments/v3/candidates/run_pose_backbone_study.py",
    "experiments/v3/diagnostics/run_root_cause_audit.py",
    "experiments/v3/holdout/build_fresh_deployment_holdout.py",
    "experiments/v3/holdout/run_holdout_evaluation_v3.py",
    "experiments/v3/tracking/evaluate_tracking_resilience.py",
    "scripts/benchmark/run_v3_system_resilience_audit.py",
    "scripts/dataset/benchmark_and_freeze_candidate_v2.py",
    "scripts/dataset/calibrate_and_train_dev_v2.py",
    "scripts/dataset/consolidate_final_metrics.py",
    "scripts/dataset/evaluate_urfd_frozen.py",
    "scripts/dataset/evaluate_v5.py",
    "scripts/dataset/evaluate_v6.py",
    "scripts/dataset/generate_upfall_test_archives.py",
    "scripts/dataset/re_evaluate_v2_frozen.py",
    "scripts/dataset/re_evaluate_v3_frozen_legacy.py",
    "src/eldercare/benchmark/harness.py",
    "src/eldercare/fall_engine/features/multiscale.py",
    "src/eldercare/fall_engine/learned_classifier/classifier_v4.py",
    "src/eldercare/fall_engine/learned_classifier/skeleton_v5.py",
    "src/eldercare/fall_engine/normalization/camera_normalizer.py",
    "src/eldercare/fall_engine/pipeline_v4.py",
    "src/eldercare/fall_engine/pipeline_v5.py",
    "src/eldercare/fall_engine/pipeline_v6_1.py",
    "src/eldercare/fall_engine/suppression/adl_suppressor.py",
    "src/eldercare/fall_engine/track_stitching.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "T201"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "T201", "B905", "E402", "F841", "N803", "N806", "B007"]
"tests/*" = ["E501", "T201", "B905", "E402", "F841", "N803", "N806", "B007", "E712"]
"experiments/*" = ["E501", "T201", "B905", "E402", "F841", "N803", "N806", "B007", "I001", "F401", "N802"]
"src/eldercare/fall_engine/learned_classifier/*" = ["N801", "N803", "N806", "B905", "E501", "F841", "B007", "N812"]
"src/eldercare/fall_engine/augmentation.py" = ["F841"]
"app/*" = ["E501", "T201"]
"streamlit_app.py" = ["E501", "T201", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["eldercare"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

