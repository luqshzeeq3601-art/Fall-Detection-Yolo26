# ElderCare Vision — Mosquitto broker configuration (P7-001).
#
# Authoritative sources: ARCHITECTURE.md §3/§8 (Mosquitto for local event
# transport/demo), EVENT_SCHEMA.md §4 (topic roots + QoS policy), CONSTRAINTS.md
# (MQTT failure must not crash vision; bounded queues; no secrets in Git).
#
# SCOPE NOTE — authentication:
# No MQTT credentials exist in PRD / ARCHITECTURE / CONSTRAINTS / settings /
# .env.example / compose. Introducing a password_file here would invent scope
# and break the documented local-demo path, so this config allows anonymous
# clients on the isolated compose network. This is a DEVELOPMENT-ONLY
# deviation. Production MUST: create a password_file, set
# `allow_anonymous false`, add per-topic ACLs, stop publishing port 1883 to
# the host, and enable TLS (`cafile`/`certfile`/`keyfile` + `require_certificate`
# as policy dictates). QoS/retained policy itself lives in the publisher
# (P7-002), not the broker.
#
# Eclipse Mosquitto 2.x directive reference (all directives below are stable
# 2.x configuration-file options; verified against the compose image
# `eclipse-mosquitto:2`).

# --- Listeners ---------------------------------------------------------------
# One explicit MQTT listener. No websocket listener, no management/debug
# listeners: the broker speaks plain MQTT to containers on the isolated
# `eldercare` network and, via compose port mapping, to the local demo host.
listener 1883
protocol mqtt

# Development-only local access (see SCOPE NOTE above).
allow_anonymous true
per_listener_settings false

# --- Persistence ---------------------------------------------------------------
# Persist retained messages + subscriptions across restarts into the
# compose-mounted volume `mosquitto-data:/mosquitto/data`.
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
autosave_on_changes true

# --- Bounds (CONSTRAINTS: bounded queues, no unbounded buffers) ----------------
# Cap concurrent clients and per-client queued messages so a slow consumer
# cannot grow broker memory without limit. Publisher-side bounds land in P7-002.
max_connections 50
max_queued_messages 1000
max_keepalive 300

# --- Logging -------------------------------------------------------------------
# Structured-enough operational logs to stdout for `docker compose logs`.
# `debug` deliberately excluded: noisy and risks leaking payload details.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
