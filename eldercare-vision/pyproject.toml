[project]
name = "eldercare-vision"
version = "0.1.0"
description = "ElderCare Vision: YOLO pose-based fall-detection research POC."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "opencv-python-headless>=4",
    "numpy>=1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0",
    "ultralytics>=8.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "onnxruntime>=1.16",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "T201"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "T201", "B905", "E402", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["eldercare"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"

